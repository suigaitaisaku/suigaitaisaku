<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>備える-出羽地区こども水害対策</title>
    <link rel="stylesheet" href="style3.css">
    <style>
        body { 
            margin: 0;
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; 
            background-color: #e6f2ff; 
            text-align: center; 
            box-sizing: border-box;
            padding-top: 100px; 
            padding-bottom: 40px;
            padding-left: 15px;
            padding-right: 15px;
        }
        .game-box { 
            background: white; 
            border: 6px solid #2196f3; 
            border-radius: 20px; 
            padding: 20px; 
            width: 90%; 
            max-width: 450px; 
            margin: 10px auto; 
            box-shadow: 0 8px 0 #b3d7ff; 
            box-sizing: border-box; 
        }
        h1 { color: #0d47a1; font-size: 1.5em; } 
        
        /* フリガナ（ルビ）の見た目調整 */
        ruby rt {
            font-size: 0.6em;
            color: color white;
            font-weight: normal;
        }

        /* 入力フォームのスタイル */
        .input-group {
            margin: 15px 0;
            text-align: left;
            background: #f0f7ff;
            padding: 15px;
            border-radius: 10px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #0d47a1;
            font-size: 1.05em;
        }
        .input-group input {
            width: 100%;
            padding: 8px;
            font-size: 1.2em;
            box-sizing: border-box;
            border: 2px solid #90caf9;
            border-radius: 5px;
            text-align: center;
        }

        .item-list { text-align: left; display: block; margin: 20px auto; max-width: 330px; }
        .item { font-size: 1.05em; margin: 15px 0; display: flex; align-items: center; justify-content: space-between; color: #1565c0; border-bottom: 1px dashed #bbdefb; padding-bottom: 8px; }
        .item-name { display: flex; align-items: center; }
        .item-count { font-weight: bold; color: #d32f2f; background: #ffebee; padding: 2px 8px; border-radius: 5px; white-space: nowrap; }
        
        input[type="checkbox"] { width: 30px; height: 30px; margin-right: 10px; flex-shrink: 0; }
        
        .check-btn { 
            background-color: #007bff; color: white; border: none;  
            padding: 15px 0; 
            width: 100%; 
            max-width: 300px;
            font-size: 1.4em; border-radius: 50px; 
            box-shadow: 0 5px 0 #0056b3; cursor: pointer; font-weight: bold; 
            margin: 10px 0;
            -webkit-tap-highlight-color: transparent;
        }
        .check-btn:active { box-shadow: none; transform: translateY(5px); }

        .exit-btn { background-color: #999; box-shadow: 0 5px 0 #666; }
        
        .btn-group {
            display: flex;
            flex-direction: column; 
            align-items: center;
        }

        .congrats { font-size: 1.8em; color: #00bcd4; font-weight: bold; margin: 10px 0;}
    </style>
</head>
<body>

<header>
    <a href="html3.html" class="header-title">
        <h2><ruby>出羽地区<rt></ruby>こども<br><ruby>水害</ruby><ruby>対策</ruby></h2>
    </a>
    <nav class="gMenu">
        <input class="menu-btn" type="checkbox" id="menu-btn">
        <label class="menu-icon" for="menu-btn">
          <span class="navicon"></span>
        </label>
        <ul class="menu">
          <li><a href="html3.html">▸ホーム</a></li>
          <li><a href="siru.html">▸知る</a></li>
          <li><a href="sonaeru.html">▸備える</a></li>
          <li><a href="koudou.html">▸行動</a></li>
          <li><a href="kuizu.html">▸クイズ</a></li>
          <li><a href="mosimo.html">▸もしも</a></li>
        </ul>
    </nav>
</header>

<main>
    <!-- 人数・日数入力画面 -->
    <div id="input-screen" class="game-box">
        <h1>ぼうさいリュック<br><ruby>計算機<rt>けいさんき</rt></ruby></h1>
        <p><ruby>家族<rt>かぞく</rt></ruby>の<ruby>人数<rt>にんずう</rt></ruby>と、何日分<rt>なんにちぶん</rt>の<ruby>備<rt>そな</rt></ruby>えに<br>するかを<ruby>入力<rt>にゅうりょく</rt></ruby>してね！</p>
        
        <div class="input-group">
            <label> <ruby>大人<rt>おとな</rt></ruby>の<ruby>人数<rt>にんずう</rt></ruby>（<ruby>中学生以上<rt>ちゅうがくせい以上</rt></ruby>）：<input type="number" id="adult-num" value="2" min="0" max="20"></label>
            <label> こどもの<ruby>人数<rt>にんずう</rt></ruby>（<ruby>小学生以下<rt>しょうがくせい以下</rt></ruby>）：<input type="number" id="child-num" value="1" min="0" max="20"></label>
            <label> 何日分の<ruby>備<rt>そな</rt></ruby>えにする？：<input type="number" id="days-num" value="3" min="1" max="14"></label>
        </div>

        <button class="check-btn" onclick="generateList()"><ruby>必要<rt>ひつよう</rt></ruby>なものを<ruby>計算<rt>けいさん</rt></ruby>する！</button>
    </div>

    <!-- リュック作成・チェック画面 -->
    <div id="setup-screen" class="game-box" style="display: none;">
        <h1> ぼうさいリュックを つくろう！</h1>
        <p id="target-info" style="font-weight: bold; color: #0277bd; font-size: 1.1em;"></p>
        
        <div class="item-list" id="calculated-items">
            <!-- JavaScriptで動的に生成されます -->
        </div>

        <button class="check-btn" onclick="finishQuest()">できた！</button>
        <button class="check-btn exit-btn" onclick="backToInput()" style="background-color: #78909c; box-shadow: 0 5px 0 #455a64;"><ruby>条件<rt>じょうけん</rt></ruby>を変える</button>
        <p id="alert-msg" style="color: #ff5722; font-weight: bold; min-height: 1.2em;"></p> 
    </div>

    <!-- クリア画面 -->
    <div id="master-screen" class="game-box" style="display: none; border-color: #00bcd4;"> 
        <div class="congrats">おめでとう！</div>
        <p>きみは <ruby>今日<rt>きょう</rt></ruby>から<br><b>ぼうさいマスター </b> だ！</p>
        <p> リュックを<br><ruby>玄関<rt>げんかん</rt></ruby>に おこう！</p>
        
        <div class="btn-group">
            <button class="check-btn" onclick="location.reload()">もういちど</button>
            <button class="check-btn exit-btn" onclick="quitGame()">やめる</button>
        </div>
    </div>
</main>

    <script>
        function generateList() {
            const adults = parseInt(document.getElementById('adult-num').value) || 0;
            const children = parseInt(document.getElementById('child-num').value) || 0;
            const days = parseInt(document.getElementById('days-num').value) || 1;
            const totalPeople = adults + children;

            if (totalPeople <= 0) {
                alert("合計1人以上を入力してください。");
                return;
            }

            document.getElementById('target-info').innerText = `【 ${totalPeople}人分 / ${days}日分 】の備え`;

            const totalLiters = totalPeople * days * 3;
            const totalWaterBottles = Math.ceil(totalLiters / 2);
            const totalMeals = totalPeople * days * 3;
            const totalToilets = totalPeople * days * 5;
            const battery = Math.max(1, Math.ceil(totalPeople / 2));
            const light = Math.max(1, Math.ceil(totalPeople / 2));

            const itemListHtml = `
                <label class="item">
                    <div class="item-name"><input type="checkbox" class="quest-check"> <ruby>飲料水<rt>いんりょうすい</rt></ruby> (2L)</div>
                    <div class="item-count">${totalWaterBottles}本</div>
                </label>
                <label class="item">
                    <div class="item-name"><input type="checkbox" class="quest-check"> <ruby>非常食<rt>ひじょうしょく</rt></ruby></div>
                    <div class="item-count">${totalMeals}食分</div>
                </label>
                <label class="item">
                    <div class="item-name"><input type="checkbox" class="quest-check"> <ruby>携帯<rt>けいたい</rt></ruby>トイレ</div>
                    <div class="item-count">${totalToilets}回分</div>
                </label>
                <label class="item">
                    <div class="item-name"><input type="checkbox" class="quest-check"> <ruby>懐中電灯<rt>かいちゅうでんとう</rt></ruby></div>
                    <div class="item-count">${light}個</div>
                </label>
                <label class="item">
                    <div class="item-name"><input type="checkbox" class="quest-check"> モバイルバッテリー</div>
                    <div class="item-count">${battery}個</div>
                </label>
                <label class="item">
                    <div class="item-name"><input type="checkbox" class="quest-check"> <ruby>救急用品<rt>きゅうきゅうようひん</rt></ruby></div>
                    <div class="item-count">1セット</div>
                </label>
                <label class="item">
                    <div class="item-name"><input type="checkbox" class="quest-check"> レインコート</div>
                    <div class="item-count">${totalPeople}着</div>
                </label>
                <label class="item">
                    <div class="item-name"><input type="checkbox" class="quest-check"> <ruby>軍手<rt>ぐんて</rt></ruby></div>
                    <div class="item-count">${totalPeople}双</div>
                </label>
            `;

            document.getElementById('calculated-items').innerHTML = itemListHtml;
            document.getElementById('input-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function backToInput() {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('input-screen').style.display = 'block';
        }

        function finishQuest() {
            const checks = document.querySelectorAll('.quest-check');
            let count = 0;
            checks.forEach(box => { if (box.checked) count++; });

            if (count === checks.length) {
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('master-screen').style.display = 'block';
                window.scrollTo(0, 0); 
            } else {
                document.getElementById('alert-msg').innerText = "あと " + (checks.length - count) + " つ 足りないよ！";
            }
        }

        function quitGame() {
            location.href = 'sonaeru.html';
        }
    </script>
</body>
<footer>
    <p>&copy;2026 出羽地区こども水害対策</p>
</footer>
</html>
